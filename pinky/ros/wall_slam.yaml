# wall_map.py의 블럭 길을 slam_toolbox로 지도 만들 때의 설정(wall_slam.launch.py가 씀). 적지 않은 값은 slam_toolbox 기본값.
# slam_toolbox 2.8.5(jazzy)의 mapper_params_online_async.yaml에서 이 길에 맞지 않는 값만 바꿨다. 계산으로 고른 값이며 확인 전(2026-11-26).
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    resolution: 0.02                 # 기본 0.05 m. 벽과의 여유가 4~5 cm라 줄임(로컬 코스트맵 0.01 m보다는 큼)
    max_laser_range: 3.0             # 기본 20 m. 길 전체가 2 m 안에 들어감
    map_update_interval: 1.0         # 기본 5초
    minimum_time_interval: 0.2       # 기본 0.5초
    minimum_travel_distance: 0.05    # 기본 0.5 m. 길 가운데 선이 2.33 m라 기본값이면 스캔이 4~5장만 쓰임
    minimum_travel_heading: 0.1      # 기본 0.5 rad
    link_scan_maximum_distance: 1.0  # 기본 1.5 m
    loop_search_maximum_distance: 1.0   # 기본 3 m
    loop_search_space_dimension: 2.0    # 기본 8 m
    correlation_search_space_dimension: 0.3   # 기본 0.5 m
    transform_publish_period: 0.02
    enable_interactive_mode: false
