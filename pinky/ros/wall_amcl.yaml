# 블럭 길에서 SLAM 지도 + AMCL로 위치를 잡을 때 덮어쓰는 값(lane_nav.launch.py map:= 일 때 읽힘). 핑키 설정을 바꾸자는 것이 아님.
# AMCL 값은 이 길(폭 0.43 m, 길이 2.3 m, 벽까지 0.1~0.8 m)에 맞춰 계산으로 고른 것이고 확인 전이다(2026-11-26).
amcl:
  ros__parameters:
    use_sim_time: true
    laser_min_range: 0.05
    laser_max_range: 3.0               # 핑키 설정 100 m
    laser_likelihood_max_dist: 0.3     # 핑키 설정 2.0 m. 벽이 가까워 넓게 볼 필요가 없음
    sigma_hit: 0.05                    # 핑키 설정 0.2 m. 차로 여유가 약 4 cm라 cm 단위로 맞춰야 함
    max_beams: 180                     # 핑키 설정 60
    z_hit: 0.8
    z_rand: 0.2
    update_min_d: 0.02                 # 핑키 설정 0.15 m. 2.3 m 길에서 자주 바로잡게
    update_min_a: 0.05                 # 핑키 설정 0.1 rad
    alpha1: 0.05                       # 오도메트리 잡음(핑키 설정 0.2). 지도 작성 주행에서 9.3 m에 약 33 mm, 1.9도(시뮬) 쌓임
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    set_initial_pose: true             # 위치는 amcl_init.yaml(map_align.py가 만듦)이 덮어씀

map_server:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map                # 오도메트리 좌표 대신 지도 좌표(경로 재계산 검사 CollisionMonitor가 지도 좌표로 보므로)

lifecycle_manager_lane:
  ros__parameters:
    node_names: ["map_server", "amcl", "controller_server", "route_server"]
