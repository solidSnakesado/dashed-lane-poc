# 벽 사이 좁은 차로(폭 약 0.21 m, wall_map.py의 길) 주행용 덮어쓰기. lane_nav.launch.py의 rpp:= 로 준다. 핑키 설정을 바꾸자는 것이 아님.
# rpp_goal.yaml의 값(주시 거리 고정 0.1 m, 도착 판정 0.02 m)을 그대로 담고, 벽 때문에 필요한 값만 더했다.
# 더한 값은 계산으로 고른 것이고 주행으로 확인한 값이 아니다(2026-11-26).
controller_server:
  ros__parameters:
    general_goal_checker:
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.5
    FollowPath:
      use_velocity_scaled_lookahead_dist: false
      lookahead_dist: 0.1
      min_lookahead_dist: 0.05
      # 핑키 설정은 장애물까지 0.6 m 안이면 속도를 줄인다(cost_scaling_dist 0.6, gain 1.5).
      # 차로 가운데에서 벽까지 약 0.11 m라 그대로 두면 전 구간에서 최저 속도(0.05 m/s)가 된다. 5 cm 안에서만 줄이게 한다.
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0     # 아래 inflation_layer의 cost_scaling_factor와 같아야 함

local_costmap:
  local_costmap:
    ros__parameters:
      # 핑키 설정 0.05 m 칸은 벽과의 여유(약 4~5 cm)보다 커서 줄임. 처음에는 0.02로 했으나 굽은 구간 바깥쪽 차로에서 RPP 충돌 경고가 나고
      # 주행이 한 번 끊겼다(2026-11-26). 그 자리에서 발자국 모서리와 벽 사이는 약 2.8 cm인데, 벽이 든 칸은 길 쪽으로 최대 한 칸 튀어나와 보인다.
      resolution: 0.01
      width: 2                               # 칸이 작아진 만큼 창을 줄임(3 m → 2 m, 200x200칸)
      height: 2
      footprint_padding: 0.01                # Nav2 기본값과 같음(핑키 설정의 로컬 코스트맵에는 지정이 없음). 값을 드러내 두려고 적음
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.10               # 핑키 설정 0.15 m. 차로 가운데(벽까지 약 0.11 m)의 비용을 낮춤

# 주행 중 경로 다시 구하기(track_runner.py, compute_and_track_route 액션에서만 쓰임. compute_route에는 영향 없음)
route_server:
  ros__parameters:
    edge_cost_functions: ["DistanceScorer", "DynamicEdgesScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    DynamicEdgesScorer:                            # 밖에서 엣지를 닫고 열고 비용을 더하는 서비스(road_event.py가 부름)
      plugin: "nav2_route::DynamicEdgesScorer"
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      costmap_topic: "local_costmap/costmap_raw"   # 라이다 장애물이 들어가는 로컬 코스트맵. 좌표가 odom이라 map = odom일 때만 맞는다(지금 시뮬)
      rate: 10.0                                   # 초당 검사 횟수(기본 1.0). 검사 한 번에 막힌 엣지 하나만 찾으므로 자주 본다
      max_collision_dist: 1.0                      # 로봇 앞 이 거리(m)까지의 경로를 검사(기본 5.0)
      max_cost: 253.0                              # 로봇 중심이 놓일 수 없는 칸(기본값)
      reroute_on_collision: true
    aggregate_blocked_ids: true                    # 막힌 엣지를 쌓아 둔다(기본 false면 직전 것만 기억해서 같은 길을 다시 고름)
