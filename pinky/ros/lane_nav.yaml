# 1-B 물리 주행 시험용 설정. 핑키 nav2_params.yaml(pinky_navigation) 다음에 읽혀서 아래 값만 덮어쓴다.
# 컨트롤러(RPP)와 로컬 코스트맵은 핑키 설정 그대로이고, 시뮬 시간 사용과 도착 판정 거리만 바꾼다.
controller_server:
  ros__parameters:
    use_sim_time: true
    general_goal_checker:
      xy_goal_tolerance: 0.05        # 핑키 설정 0.25 m는 19 cm 차로 트랙에서 너무 일찍 도착 처리됨(시험용으로 줄임)
      yaw_goal_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

route_server:
  ros__parameters:
    use_sim_time: true
    base_frame: "base_footprint"
    route_frame: "map"
    path_density: 0.05               # dense path 점 간격(m), Route Server 문서와 같음
    smooth_corners: false            # 그래프 점이 4 mm 간격이라 모서리 다듬기는 필요 없음
    graph_filepath: ""               # 런치에서 넣음
    edge_cost_functions: ["DistanceScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    # operations: 지정하지 않음(빈 목록 [] 은 ROS 파라미터에서 형식을 알 수 없어 route_server가 시작하지 못함). 기본값 AdjustSpeedLimit, ReroutingService가 켜지며 compute_route에는 영향 없음
    boundary_radius_to_achieve_node: 0.05   # Route Server 문서: 기본 1.0 m는 너무 커서 5~10 cm로
    radius_to_achieve_node: 0.05
    enable_nn_search: false

lifecycle_manager_lane:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["controller_server", "route_server"]
    bond_timeout: 0.0
