# 핑키 전방 카메라 설정 (실측). 시뮬레이션 장면, 학습 데이터 생성, 후처리가 모두 이 파일을 읽는다.
# 카메라를 다시 달거나 각도를 바꾸면 calib_pose_live.py로 다시 재서 extrinsic 값만 고친다.
sensor: ov5647
capture: "rpicam --rotation 180 --mode 640:480:10:P --width 640 --height 480"   # 같은 모드로 찍어야 아래 값이 맞음
image_width: 640
image_height: 480
intrinsic:                 # calib_intrinsic.py, 2026-11-20, 87장, 재투영 오차 0.268 px, k3 고정
  fx: 567.6
  fy: 566.7
  cx: 323.5
  cy: 252.6
  dist: [0.0941, -0.2864, 0.0071, 0.0011, 0.0]   # k1 k2 p1 p2 k3 (OpenCV)
  hfov_deg: 58.8
  vfov_deg: 45.9
extrinsic:                 # calib_pose_live.py, 2026-11-20, 10번 측정(들었다 놓기 포함) 평균
  height_m: 0.0580         # 주행면에서 카메라 광학 중심까지
  tilt_down_deg: 8.76      # 수평에서 아래로 숙인 각
  roll_deg: -1.54          # +: 화면 오른쪽이 위로 들림
  forward_m: 0.033         # 바퀴 축 중심에서 카메라까지 앞쪽 거리 (설계값, 실측 아님)
randomize:                 # 학습 데이터 생성 때 흔드는 범위 (측정 흔들림의 약 2배)
  tilt_deg: 1.0
  roll_deg: 0.5
  height_m: 0.002
